# cairn.conf — see cairn.conf(5) for every key and its default.
#
# Everything below is a default made explicit. Delete what you do not need.

# The directory must exist: cairnd creates nothing. systemd makes /run/cairn
# from RuntimeDirectory=cairn; by hand, create it or listen somewhere else.
listen = unix:/run/cairn/cairn.sock
socket_mode = 0660
archive_dir = /var/lib/cairn/archives

# Start with best-effort, read `cairn status`, then set require once you know
# the kernel gives you what you asked for.
sandbox = best-effort
sandbox_action = kill

# A single shared bearer token, or nothing. Prefer the file form.
# auth_token_file = /etc/cairn/token

max_connections = 64
read_timeout = 15s
write_timeout = 30s
keepalive_requests = 100
keepalive_timeout = 15s
request_rate = 50
request_burst = 100

max_cluster_bytes = 32M
cluster_cache_bytes = 64M

max_request_line = 8K
max_header_bytes = 16K
max_headers = 64
max_path_bytes = 1K
suggest_max_query = 128
suggest_max_results = 32

# Clients that render entries must do so in an isolated origin regardless;
# see cairn-api(7). This header is what a server can do without parsing HTML.
content_security_policy = default-src 'none'; sandbox

log_level = info
access_log = off
