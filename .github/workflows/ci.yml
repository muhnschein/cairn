name: ci

on:
  # Pull requests cover branch work; pushes cover the default branch only, so
  # a branch with a PR open is not built twice.
  push:
    branches: [main]
  pull_request:
  # Fuzzing on a pull request is a smoke test. The real run is nightly.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show && cargo --version
      - run: make fmt
      - run: make lint
      - run: make doc-lint
      # `make check` runs this; without it here the completion scripts are the
      # one thing in the tree no job parses. The shells are installed because
      # the target skips whichever is absent, and a check that skips is not one.
      - name: Shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: make completion-lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  # The workload under the live seccomp filter, and the failure modes that
  # only show up against a real daemon.
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make smoke
      - run: make chaos
      - run: make sandbox

  # A dependency added without review, a GPL-family licence, or a crate that
  # crosses a boundary from the scope.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make deps

  # The distroless image: built, then driven rootless and read-only under
  # podman, with cairnd's own confinement expected to apply inside podman's
  # seccomp filter. The runner's kernel provides Landlock; this is where
  # `sandbox = require` in a container gets proven, not assumed.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show && cargo --version
      - name: Podman
        run: command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
      - name: Smoke
        run: |
          systemctl --user daemon-reload 2>/dev/null || true
          make container-smoke

  man:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mandoc
      - run: make man-lint

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # 60 seconds a target, from the committed seeds. Enough to catch a
  # regression a seed already reaches; not a real fuzzing run.
  fuzz:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly
      - run: cargo +nightly install cargo-fuzz --locked
      - run: make fuzz FUZZ_TIME=60

  # The real run. The corpus is restored from the previous night, extended,
  # minimised, and saved again, so coverage accumulates across runs instead of
  # restarting from the seeds every time.
  fuzz-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [archive, request]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly
      - run: cargo +nightly install cargo-fuzz --locked

      # A cache entry is immutable, so each night writes a new key and the
      # restore-keys prefix finds the most recent one. Without this the corpus
      # would be thrown away every night and only ever re-find what the seeds
      # already reach.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Seed anything the corpus is missing
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp -n fuzz/seeds/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/ || true
          echo "starting from $(find fuzz/corpus/${{ matrix.target }} -type f | wc -l) inputs"

      - name: Fuzz
        run: |
          cd fuzz
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=1800

      # Minimise before saving: an unminimised corpus grows without bound and
      # slows every later run down.
      - name: Minimise
        if: always()
        run: cd fuzz && cargo +nightly fuzz cmin ${{ matrix.target }}

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # The corpus lives in the cache, which expires. This is the copy a human
      # can download and fold into the committed seeds with `make fuzz-seed`.
      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 30

      # A crash is the point of the exercise; keep the input that caused it.
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
