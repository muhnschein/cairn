name: release

# Cutting a release is tagging it: v2026.08 publishes
# ghcr.io/muhnschein/cairn:2026.08 (and :latest) for both amd64 and arm64.
# The compiler comes from rust-toolchain.toml, the build is reproducible
# from Cargo.lock, so the image is exactly what `make test` tested.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The arm64 half of the manifest list runs under emulation; a release
      # build taking its time once a month is the price of not asking users
      # to trust an untested architecture claim.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calver is not semver, and metadata-action's semver type rejects it
      # (the first release run pushed only :latest). The tag name minus its
      # v is the whole rule: v2026.08 -> 2026.08.
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          # No attestation manifests: a quadlet pulls a tag and gets the
          # image, not a list of signatures it did not ask about.
          provenance: false
